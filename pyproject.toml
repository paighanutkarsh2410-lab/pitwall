[project]
name = "pitwall"
version = "0.2.0"
description = "Race telemetry platform: replays real Grands Prix as a live event stream."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiokafka==0.15.0",
  "asyncpg==0.32.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pydantic==2.14.2",
  "uvicorn==0.54.0",
  "websockets==17.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[project.scripts]
pitwall = "pitwall.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
