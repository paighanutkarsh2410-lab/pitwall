# grafana-community/tempo, single binary: traces arrive over OTLP from the collector.
tempo:
  retention: 24h
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
persistence:
  enabled: true
  size: 2Gi
