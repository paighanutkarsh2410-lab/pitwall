# App of apps: Argo CD watches deploy/apps and creates whatever Applications are there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pitwall-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paighanutkarsh2410-lab/pitwall.git
    targetRevision: main
    path: deploy/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
