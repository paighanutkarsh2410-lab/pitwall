# Argo CD for Pitwall, on top of the verified upstream install.yaml (scripts/cluster-up.sh
# downloads it and checks its SHA-256).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - install.yaml
  - ingress.yaml
patches:
  # Plain HTTP behind Traefik, at http://argocd.pitwall.localtest.me:8080.
  - target: { kind: ConfigMap, name: argocd-cmd-params-cm }
    patch: |-
      - op: add
        path: /data
        value:
          server.insecure: "true"
  - target: { kind: ConfigMap, name: argocd-cm }
    patch: |-
      - op: add
        path: /data
        value:
          timeout.reconciliation: 60s
  # Pitwall doesn't use Dex (SSO) or notifications: keep them off a laptop's memory.
  - target: { kind: Deployment, name: argocd-dex-server }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target: { kind: Deployment, name: argocd-notifications-controller }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
