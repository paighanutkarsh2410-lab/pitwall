# The local kind cluster (scripts/cluster-up.sh).
image:
  # CI sets this to the commit it just built, scanned and signed (the "promote" job).
  tag: 7b9206b3caa90238c718553c16e7d2ab269a8d22
  pullPolicy: IfNotPresent  # tags are commit SHAs: an image never changes under a tag
logos:
  hostPath: /pitwall-logos  # the laptop's assets/private/
observability:
  otlpEndpoint: http://otel-collector-opentelemetry-collector.observability:4318
faults: true  # drills: inject delays to rehearse the runbooks
ingress:
  hosts: [pitwall.localtest.me, localhost]
