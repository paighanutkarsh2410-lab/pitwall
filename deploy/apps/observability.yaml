# Observability: Prometheus and Alertmanager, Grafana, Loki, Tempo and the OpenTelemetry Collector,
# each an upstream chart at a pinned version with its values from this repository (deploy/
# observability), plus Pitwall's own SLO rules and dashboards (deploy/charts/pitwall-observability).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pitwall-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/paighanutkarsh2410-lab/pitwall.git
    targetRevision: main
    path: deploy/charts/pitwall-observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.40.3
      helm:
        releaseName: prometheus
        valueFiles: [$values/deploy/observability/prometheus.yaml]
    - repoURL: https://github.com/paighanutkarsh2410-lab/pitwall.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
