apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pitwall
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/paighanutkarsh2410-lab/pitwall.git
    targetRevision: main
    path: deploy/charts/pitwall
    helm:
      valueFiles: [../../env/local/pitwall.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: pitwall
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    # The first sync after Argo Rollouts is added may arrive before its CRDs do: try again.
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
