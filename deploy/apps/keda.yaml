# KEDA: autoscaling on consumer lag and connected browsers. Wave -1: its CRDs come before
# the ScaledObjects in the pitwall and pitwall-trackside charts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: 2.21.0
      helm:
        releaseName: keda
        valueFiles: [$values/deploy/platform/keda.yaml]
    - repoURL: https://github.com/paighanutkarsh2410-lab/pitwall.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
