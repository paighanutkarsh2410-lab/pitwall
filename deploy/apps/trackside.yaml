# The trackside site: its own Redpanda, the replayer, the uplink and the link to the factory.
# Wave 1: after the factory's Redpanda (wave 0), whose uplink listener it connects to.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pitwall-trackside
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/paighanutkarsh2410-lab/pitwall.git
    targetRevision: main
    path: deploy/charts/pitwall-trackside
    helm:
      # The image tag is promoted into pitwall.yaml; both sites read it from there.
      valueFiles: [../../env/local/pitwall.yaml, ../../env/local/trackside.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: trackside
  # KEDA owns the uplink's replica count.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: uplink
      jsonPointers: [/spec/replicas]
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true]
    # The first sync after KEDA is added may arrive before its CRDs do: try again.
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
