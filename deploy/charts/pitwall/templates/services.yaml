{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "pitwall.labels" $ | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
{{- if $svc.canary }}
# Released by Argo Rollouts: a canary runs next to the stable version and is promoted only if its
# own metrics pass the analysis in analysis.yaml; otherwise it is rolled back automatically.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "pitwall.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  {{- if $svc.canary }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: {{ $.Values.canary.progressDeadlineSeconds }}
  progressDeadlineAbort: true  # a canary that never becomes ready (a crash loop) is rolled back
  strategy:
    canary:
      canaryMetadata:
        labels: { pitwall.dev/role: canary }
      stableMetadata:
        labels: { pitwall.dev/role: stable }
      maxSurge: 1
      maxUnavailable: 0
      steps:
        # With one or two replicas, any weight below 50 means exactly one canary pod.
        - setWeight: {{ $.Values.canary.weight }}
        - pause: { duration: {{ $.Values.canary.warmup }} }
        - analysis:
            templates:
              - templateName: canary-{{ $svc.canary }}
            args:
              - { name: service, value: {{ $name }} }
              - name: hash
                valueFrom: { podTemplateHashValue: Latest }
  {{- else if $svc.races }}
  strategy: { type: Recreate }  # one replayer at a time: it is the race itself, not a service
  {{- end }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "pitwall.labels" $ | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics/
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $name }}
          image: {{ include "pitwall.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [service, {{ $name }}]
          env:
            - { name: PORT, value: "8080" }
            - { name: PITWALL_BROKERS, value: {{ $.Values.brokers | quote }} }
            - { name: PITWALL_SERVICE, value: {{ $name }} }
            - { name: PITWALL_VERSION, value: {{ $.Values.image.tag | quote }} }
            - { name: PITWALL_LOG_FORMAT, value: json }
            - { name: PITWALL_FAULTS, value: {{ $.Values.faults | quote }} }
            # Which copy this is: stable and canary pods differ in their template hash.
            - name: POD_TEMPLATE_HASH
              valueFrom:
                fieldRef: { fieldPath: "metadata.labels['rollouts-pod-template-hash']" }
            {{- with $svc.defect }}
            # A rehearsed bad release (docs/progressive-delivery.md).
            - { name: PITWALL_DEFECT, value: {{ . | quote }} }
            {{- end }}
            {{- with $.Values.observability.otlpEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ . | quote }} }
            {{- end }}
            {{- if $svc.db }}
            - name: PITWALL_DB_URL
              valueFrom:
                secretKeyRef: { name: {{ $.Values.dbSecret }}, key: PITWALL_DB_URL }
            {{- end }}
            {{- if eq $name "api" }}
            - { name: PITWALL_REPLAYER_URL, value: {{ $.Values.replayerUrl | quote }} }
            - { name: PITWALL_LOGOS_DIR, value: /logos }
            {{- end }}
            {{- if eq $name "replayer" }}
            - { name: PITWALL_AUTOSTART, value: {{ $.Values.replayer.autostart | quote }} }
            - { name: PITWALL_AUTOSTART_SPEED, value: {{ $.Values.replayer.speed | quote }} }
            - { name: PITWALL_LOOP, value: {{ $.Values.replayer.loop | quote }} }
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if $svc.races }}
            - { name: races, mountPath: /data }
            {{- end }}
            {{- if and (eq $name "api") $.Values.logos.hostPath }}
            - { name: logos, mountPath: /logos, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
        {{- if $svc.races }}
        - name: races
          {{- if $.Values.races.hostPath }}
          hostPath: { path: {{ $.Values.races.hostPath }}, type: DirectoryOrCreate }
          {{- else }}
          persistentVolumeClaim: { claimName: pitwall-races }
          {{- end }}
        {{- end }}
        {{- if and (eq $name "api") $.Values.logos.hostPath }}
        - name: logos
          hostPath: { path: {{ $.Values.logos.hostPath }}, type: DirectoryOrCreate }
        {{- end }}
{{- end }}
