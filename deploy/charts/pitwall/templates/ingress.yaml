# The pit wall: the screen, its API and its WebSocket, all served by pitwall-api.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pitwall
  labels: {{- include "pitwall.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8080 } }
    {{- end }}
