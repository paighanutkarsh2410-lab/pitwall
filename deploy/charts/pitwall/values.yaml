image:
  repository: ghcr.io/paighanutkarsh2410-lab/pitwall
  tag: main
  pullPolicy: IfNotPresent

brokers: redpanda:9092

observability:
  # Traces go to the OpenTelemetry Collector on the same node; empty turns tracing off.
  otlpEndpoint: ""

# The /faults endpoint for drills (docs/runbooks). Off unless an environment turns it on.
faults: false
# Secret with PITWALL_DB_URL (created by scripts/cluster-up.sh; never in Git).
dbSecret: pitwall-db

# One entry per service; every one runs the same image: `pitwall service <name>`.
# `canary` names the analysis a new version must pass (templates/analysis.yaml); a service
# without one is a plain Deployment. `defect` turns a build into a rehearsed bad release.
services:
  ingest:
    # Two replicas share the partitions; a canary joins them and takes its share.
    replicas: 2
    db: true
    canary: ingest
    defect: ""
    resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 384Mi } }
  timing:
    replicas: 1
    canary: timing
    defect: ""
    resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { memory: 256Mi } }
  strategy:
    replicas: 1
    canary: strategy
    defect: ""
    resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { memory: 256Mi } }
  api:
    replicas: 1
    db: true
    canary: api
    defect: ""
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
  # The replayer runs at the track (the pitwall-trackside chart). Add it here for a single-site
  # setup: replayer: { replicas: 1, races: true, resources: {...} }

# Progressive delivery with Argo Rollouts: one canary pod next to the stable version, a short
# warm-up, then analysis of the canary's own metrics; promoted if it passes, rolled back if not.
canary:
  weight: 20
  warmup: 20s
  progressDeadlineSeconds: 240
  prometheus: http://prometheus-server.observability.svc
  analysis:
    initialDelay: 45s
    interval: 30s
    count: 5

# Where pitwall-api reaches the replayer (at the track, in the trackside namespace).
replayerUrl: http://replayer.trackside.svc:8080

replayer:
  # Only for a single-site setup with services.replayer (see above).
  autostart: 2024-sao-paulo
  speed: 1
  loop: true

# Where races are kept. hostPath shares the laptop's ~/.pitwall (mounted into the kind node by
# scripts/cluster-up.sh), so a race downloaded once is there for both. Without it, a volume.
races:
  hostPath: ""
  storage: 1Gi

# Team logos from the laptop's assets/private/ (never in Git); empty means team-colour badges.
logos:
  hostPath: ""

ingress:
  # Every host the pit wall answers on. localhost works even where *.localtest.me is blocked.
  hosts: [pitwall.localtest.me, localhost]
  className: traefik
