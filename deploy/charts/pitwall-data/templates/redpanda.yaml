# One Redpanda broker: Kafka-compatible, a single binary, no ZooKeeper, light enough for kind.
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels: { app.kubernetes.io/name: redpanda, app.kubernetes.io/part-of: pitwall }
spec:
  selector: { app.kubernetes.io/name: redpanda }
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
    {{- if .Values.redpanda.uplinkAdvertise }}
    - { name: uplink, port: 9093, targetPort: uplink }
    {{- end }}
    - { name: admin, port: 9644, targetPort: admin }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels: { app.kubernetes.io/name: redpanda, app.kubernetes.io/part-of: pitwall }
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redpanda }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redpanda, app.kubernetes.io/part-of: pitwall }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9644"
        prometheus.io/path: /public_metrics
    spec:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redpanda
          image: {{ .Values.redpanda.image }}
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory={{ .Values.redpanda.memory }}
            - --reserve-memory=0M
            - --overprovisioned
            - --default-log-level=warn
            {{- if .Values.redpanda.uplinkAdvertise }}
            # A second listener for the trackside uplink. It advertises the link (Toxiproxy), so a
            # client that connects through the link keeps talking through it.
            - --kafka-addr=internal://0.0.0.0:9092,uplink://0.0.0.0:9093
            - --advertise-kafka-addr=internal://redpanda.{{ .Release.Namespace }}.svc.cluster.local:9092,uplink://{{ .Values.redpanda.uplinkAdvertise }}
            {{- else }}
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda.{{ .Release.Namespace }}.svc.cluster.local:9092
            {{- end }}
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=redpanda-0.redpanda.{{ .Release.Namespace }}.svc.cluster.local:33145
          ports:
            - { name: kafka, containerPort: 9092 }
            {{- if .Values.redpanda.uplinkAdvertise }}
            - { name: uplink, containerPort: 9093 }
            {{- end }}
            - { name: admin, containerPort: 9644 }
          readinessProbe:
            httpGet: { path: /v1/status/ready, port: admin }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: kafka }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources: {{- toYaml .Values.redpanda.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/redpanda/data }
            # Redpanda writes its effective configuration here at start-up.
            - { name: config, mountPath: /etc/redpanda }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          emptyDir: { medium: Memory, sizeLimit: 8Mi }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.redpanda.storage }} } }
