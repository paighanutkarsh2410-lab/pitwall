# TimescaleDB: PostgreSQL with time-series hypertables, for telemetry and lap history.
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  labels: { app.kubernetes.io/name: timescaledb, app.kubernetes.io/part-of: pitwall }
spec:
  selector: { app.kubernetes.io/name: timescaledb }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  labels: { app.kubernetes.io/name: timescaledb, app.kubernetes.io/part-of: pitwall }
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: timescaledb }
  template:
    metadata:
      labels: { app.kubernetes.io/name: timescaledb, app.kubernetes.io/part-of: pitwall }
    spec:
      securityContext:
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: timescaledb
          image: {{ .Values.timescaledb.image }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.timescaledb.existingSecret }}, key: POSTGRES_PASSWORD }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: TS_TUNE_MEMORY, value: {{ .Values.timescaledb.tuneMemory | quote }} }
            - { name: TS_TUNE_NUM_CPUS, value: "2" }
            - { name: TIMESCALEDB_TELEMETRY, value: "off" }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            periodSeconds: 5
            timeoutSeconds: 3
          # Patient: the GameDay's slow disk made pg_isready miss the default 1 s, and the
          # restart (WAL replay on that same slow disk) only made the outage longer.
          livenessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml .Values.timescaledb.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            # Postgres's socket and lock files, and scratch space.
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: { medium: Memory, sizeLimit: 8Mi }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.timescaledb.storage }} } }
