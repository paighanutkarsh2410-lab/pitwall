# Grafana's dashboard sidecar picks up every ConfigMap labelled grafana_dashboard.
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    app.kubernetes.io/part-of: pitwall
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Pitwall
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
