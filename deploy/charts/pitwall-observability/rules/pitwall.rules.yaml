- name: pitwall-symptoms
  rules:
  - alert: PitwallServiceDown
    expr: up{namespace="pitwall"} == 0
    for: 1m
    labels:
      severity: page
    annotations:
      summary: '{{ $labels.pod }} is not answering Prometheus'
      runbook_url: https://github.com/paighanutkarsh2410-lab/pitwall/blob/main/docs/runbooks/service-down.md
  - alert: PitwallConsumerLagHigh
    expr: max by (service, topic) (pitwall_consumer_lag_messages) > 10000
    for: 2m
    labels:
      severity: ticket
    annotations:
      summary: '{{ $labels.service }} is {{ $value }} messages behind on {{ $labels.topic }}'
      runbook_url: https://github.com/paighanutkarsh2410-lab/pitwall/blob/main/docs/runbooks/consumer-lag.md
  - alert: PitwallDeadLetters
    expr: sum(increase(pitwall_events_total{outcome="deadlettered"}[5m])) > 0
    for: 0m
    labels:
      severity: ticket
    annotations:
      summary: Events are failing the schema and going to pitwall.deadletter
      runbook_url: https://github.com/paighanutkarsh2410-lab/pitwall/blob/main/docs/runbooks/ingest-validity.md
  - alert: PitwallReplayBehind
    expr: pitwall_replay_behind_seconds > 5
    for: 2m
    labels:
      severity: ticket
    annotations:
      summary: The replayer is {{ $value | humanizeDuration }} behind the race's schedule
      runbook_url: https://github.com/paighanutkarsh2410-lab/pitwall/blob/main/docs/runbooks/consumer-lag.md
  - alert: PitwallPodRestarting
    expr: increase(kube_pod_container_status_restarts_total{namespace="pitwall"}[15m]) > 2
    for: 0m
    labels:
      severity: ticket
    annotations:
      summary: '{{ $labels.pod }} restarted {{ $value }} times in 15 minutes'
      runbook_url: https://github.com/paighanutkarsh2410-lab/pitwall/blob/main/docs/runbooks/service-down.md
