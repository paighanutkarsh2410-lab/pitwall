# Generated by scripts/slos.py from the SLOs defined there. Do not edit by hand.
groups:
- name: pitwall-slo-telemetry-freshness
  rules:
  - record: pitwall:slo_error_ratio:rate5m
    expr: ((sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[5m])) - sum(rate(pitwall_event_freshness_seconds_bucket{stage="api",le="0.5"}[5m])))) / (sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[5m])) > 0)
    labels:
      slo: telemetry-freshness
  - record: pitwall:slo_error_ratio:rate30m
    expr: ((sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[30m])) - sum(rate(pitwall_event_freshness_seconds_bucket{stage="api",le="0.5"}[30m])))) / (sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[30m])) > 0)
    labels:
      slo: telemetry-freshness
  - record: pitwall:slo_error_ratio:rate1h
    expr: ((sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[1h])) - sum(rate(pitwall_event_freshness_seconds_bucket{stage="api",le="0.5"}[1h])))) / (sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[1h])) > 0)
    labels:
      slo: telemetry-freshness
  - record: pitwall:slo_error_ratio:rate2h
    expr: ((sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[2h])) - sum(rate(pitwall_event_freshness_seconds_bucket{stage="api",le="0.5"}[2h])))) / (sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[2h])) > 0)
    labels:
      slo: telemetry-freshness
  - record: pitwall:slo_error_ratio:rate6h
    expr: ((sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[6h])) - sum(rate(pitwall_event_freshness_seconds_bucket{stage="api",le="0.5"}[6h])))) / (sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[6h])) > 0)
    labels:
      slo: telemetry-freshness
  - record: pitwall:slo_error_ratio:rate1d
    expr: ((sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[1d])) - sum(rate(pitwall_event_freshness_seconds_bucket{stage="api",le="0.5"}[1d])))) / (sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[1d])) > 0)
    labels:
      slo: telemetry-freshness
  - record: pitwall:slo_error_ratio:rate3d
    expr: ((sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[3d])) - sum(rate(pitwall_event_freshness_seconds_bucket{stage="api",le="0.5"}[3d])))) / (sum(rate(pitwall_event_freshness_seconds_count{stage="api"}[3d])) > 0)
    labels:
      slo: telemetry-freshness
  - record: pitwall:slo_objective
    expr: vector(0.99)
    labels:
      slo: telemetry-freshness
  - record: pitwall:slo_error_budget_remaining:3d
    expr: 1 - (pitwall:slo_error_ratio:rate3d{slo="telemetry-freshness"} / 0.01)
    labels:
      slo: telemetry-freshness
  - alert: PitwallTelemetryFreshnessBudgetPage
    expr: (pitwall:slo_error_ratio:rate1h{slo="telemetry-freshness"} > 0.144 and pitwall:slo_error_ratio:rate5m{slo="telemetry-freshness"} > 0.144) or (pitwall:slo_error_ratio:rate6h{slo="telemetry-freshness"} > 0.06 and pitwall:slo_error_ratio:rate30m{slo="telemetry-freshness"} > 0.06)
    labels:
      severity: page
      slo: telemetry-freshness
    annotations:
      summary: 'telemetry-freshness: error budget burning too fast (page)'
      description: 'SLO: 99% of car telemetry reaches the pit wall within 500 ms of being sent. Objective 99.0%.'
      runbook_url: https://github.com/paighanutkarsh2410-lab/pitwall/blob/main/docs/runbooks/telemetry-freshness.md
  - alert: PitwallTelemetryFreshnessBudgetTicket
    expr: (pitwall:slo_error_ratio:rate1d{slo="telemetry-freshness"} > 0.03 and pitwall:slo_error_ratio:rate2h{slo="telemetry-freshness"} > 0.03) or (pitwall:slo_error_ratio:rate3d{slo="telemetry-freshness"} > 0.01 and pitwall:slo_error_ratio:rate6h{slo="telemetry-freshness"} > 0.01)
    labels:
      severity: ticket
      slo: telemetry-freshness
    annotations:
      summary: 'telemetry-freshness: error budget burning too fast (ticket)'
      description: 'SLO: 99% of car telemetry reaches the pit wall within 500 ms of being sent. Objective 99.0%.'
      runbook_url: https://github.com/paighanutkarsh2410-lab/pitwall/blob/main/docs/runbooks/telemetry-freshness.md
