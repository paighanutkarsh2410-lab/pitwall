name: Nightly chaos

# A trimmed GameDay every night on a throwaway kind cluster: kill the factory broker and crash
# the processors mid-race, and fail if a hypothesis in scripts/gameday.py doesn't hold
# (events lost, a pit stop counted twice, no recovery in time). docs/scale-and-chaos.md
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      experiments:
        description: Experiments to run (space-separated; see scripts/gameday.py --list)
        default: pod-kill broker-kill

permissions:
  contents: read

concurrency:
  group: nightly-chaos
  cancel-in-progress: false

jobs:
  gameday:
    name: GameDay on kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      # The race comes from OpenF1 once, then from the cache.
      - uses: actions/cache@v4
        with:
          path: ~/.pitwall/races/2024-sao-paulo
          key: race-2024-sao-paulo-v1
      - run: pitwall fetch 2024-sao-paulo
      - name: Run the suite
        env:
          PITWALL_REPORTS: ${{ github.workspace }}/chaos-reports
          EXPERIMENTS: ${{ inputs.experiments || 'pod-kill broker-kill' }}
        run: ./scripts/chaos-suite.sh $EXPERIMENTS
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-reports
          path: chaos-reports/
          if-no-files-found: ignore
