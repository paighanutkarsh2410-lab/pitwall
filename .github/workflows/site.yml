name: Site

# The public site on GitHub Pages: the race (a scroll-driven broadcast), the pit wall (the real
# screen, playing a recording) and how it is built. The race data is not in Git: it is
# downloaded from OpenF1 (cached), recorded through Pitwall's own timing, strategy and API code
# by scripts/record_race.py, and assembled with the pages by scripts/build_site.py.
on:
  push:
    branches: [main]
    paths:
      - "site/builds/**"
      - "web/**"
      - "scripts/record_race.py"
      - "scripts/build_site.py"
      - "src/pitwall/timing.py"
      - "src/pitwall/strategy.py"
      - "src/pitwall/live.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: ~/.pitwall/races/2024-sao-paulo
          key: race-2024-sao-paulo-v1
      - run: pitwall fetch 2024-sao-paulo
      - name: Record the race through Pitwall's own models
        run: python scripts/record_race.py 2024-sao-paulo site/public/data
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the pit wall in recording mode
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build:site
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
