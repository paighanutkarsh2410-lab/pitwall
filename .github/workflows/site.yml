name: Site

# The public site on GitHub Pages: the home page (each race's winning car, in 3D), the pit wall
# (the real screen, playing a recorded race) and how it is built.
#
# The race recordings are not in Git and not rebuilt here: recording every race since 2023 takes
# hours at OpenF1's free rate limit. scripts/publish_site_data.sh records them on a workstation
# and uploads them as one archive to the `site-data` release; this workflow downloads it.
on:
  push:
    branches: [main]
    paths:
      - "site/builds/**"
      - "web/**"
      - "scripts/build_site.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the race recordings (the site-data release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/public/data
          gh release download site-data --repo "${{ github.repository }}" --pattern "site-data.tar.gz" --dir /tmp
          tar -xzf /tmp/site-data.tar.gz -C site/public/data
          echo "races: $(ls site/public/data | wc -l)"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/builds/home/package-lock.json
      - name: Build the pit wall in recording mode
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build:site
      - name: Build the home page (the winning cars in 3D)
        working-directory: site/builds/home
        run: npm ci --no-audit --no-fund && npm run build
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
