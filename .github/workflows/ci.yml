name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      # Includes the check that schemas/events.v1.json matches the code.
      - run: pytest -q

  security:
    name: Trivy scan of the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  image:
    name: Replayer image (scanned; signed on main)
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/pitwall-replayer
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$IMAGE:$GITHUB_SHA" .

      - name: It runs, as a non-root user
        run: |
          docker run --rm "$IMAGE:$GITHUB_SHA" --help | grep -q "replay"
          test "$(docker run --rm --entrypoint id "$IMAGE:$GITHUB_SHA" -u)" = 10001

      - name: Scan the image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push'
        id: push
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:main"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign
        if: github.event_name == 'push'
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"
