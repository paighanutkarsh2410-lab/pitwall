name: CI

on:
  push:
    branches: [main]
    # A docs-only change needs no new image and no redeploy; nor does an environment's values
    # (a release drill, a setting): Argo CD deploys those straight from Git.
    paths-ignore: ["docs/**", "**/*.md", "deploy/env/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

jobs:
  test:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      # Includes the check that schemas/events.v1.json matches the code.
      - run: pytest -q

  web:
    name: Pit-wall screen typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  charts:
    name: Helm charts and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Lint
        run: helm lint deploy/charts/pitwall deploy/charts/pitwall-data deploy/charts/pitwall-observability
      - name: Render with the local environment's values
        run: |
          helm template pitwall deploy/charts/pitwall -f deploy/env/local/pitwall.yaml > /dev/null
          helm template pitwall-data deploy/charts/pitwall-data -f deploy/env/local/data.yaml > /dev/null
      - name: Render the observability stack at its pinned versions
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          cd deploy/observability
          helm template prometheus prometheus-community/prometheus --version 29.40.3 -f prometheus.yaml > /dev/null
          helm template grafana grafana-community/grafana --version 14.3.1 -f grafana.yaml > /dev/null
          helm template loki grafana/loki --version 7.5.0 -f loki.yaml > /dev/null
          helm template tempo grafana-community/tempo --version 3.2.1 -f tempo.yaml > /dev/null
          helm template otel-collector open-telemetry/opentelemetry-collector --version 0.178.2 -f otel-collector.yaml > /dev/null
          helm repo add argo https://argoproj.github.io/argo-helm
          helm template argo-rollouts argo/argo-rollouts --version 2.43.9 -f ../platform/argo-rollouts.yaml > /dev/null
      - name: Scripts parse
        run: for s in scripts/*.sh; do bash -n "$s"; done

  security:
    name: Trivy scan of the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  image:
    name: Image (scanned; signed on main)
    needs: [test, web, charts, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/pitwall
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$IMAGE:$GITHUB_SHA" .

      - name: It runs as a non-root user, with the screen inside
        run: |
          docker run --rm "$IMAGE:$GITHUB_SHA" service --help | grep -q "ingest"
          test "$(docker run --rm --entrypoint id "$IMAGE:$GITHUB_SHA" -u)" = 10001
          docker run --rm --entrypoint test "$IMAGE:$GITHUB_SHA" -f /srv/pitwall/web/index.html

      - name: Scan the image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push'
        id: push
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:main"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign
        if: github.event_name == 'push'
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

  # GitOps: the cluster runs exactly what CI built, scanned and signed. This commits the new
  # image tag into deploy/env/local/pitwall.yaml; Argo CD sees the commit and rolls it out.
  promote:
    name: Promote to the local environment
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: promote
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the local environment at this commit's image
        run: |
          sed -i -E "s|^(  tag: ).*|\1${GITHUB_SHA}|" deploy/env/local/pitwall.yaml
          git diff --quiet && { echo "Already deployed"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${GITHUB_SHA::7} to the local environment [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
