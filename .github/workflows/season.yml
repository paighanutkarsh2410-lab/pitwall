name: Season

# Adds each race to the public site after it is run, with nothing to do by hand: records it from
# OpenF1, uploads the recording to the `site-data` release (one file per race, so nothing already
# there is touched), commits the catalogue, and redeploys the site. Hourly around race weekends,
# daily otherwise. Nothing new, or data not complete yet, changes nothing.
on:
  schedule:
    - cron: "23 * * * 0,1,6" # hourly, Saturday to Monday (UTC)
    - cron: "23 9 * * 2-5"
  workflow_dispatch:
    inputs:
      redo:
        description: Record this race again (e.g. 2026-las-vegas)
        default: ""

permissions:
  contents: read

concurrency:
  group: season
  cancel-in-progress: false

jobs:
  update:
    name: Add finished races
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write # the release file, and the catalogue commit
      actions: write # starting the Site workflow
    env:
      GH_TOKEN: ${{ github.token }}
      CATALOGUE: site/builds/home/public/races.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Record finished races
        id: season
        env:
          REDO: ${{ inputs.redo }}
        run: PITWALL_HOME="$RUNNER_TEMP/pitwall" python scripts/update_season.py --data "$RUNNER_TEMP/data" --redo "$REDO"
      # Recordings first: a race is in the catalogue only once its recording is in the release.
      - name: Upload the recordings
        if: steps.season.outputs.added != ''
        env:
          ADDED: ${{ steps.season.outputs.added }}
        run: |
          for race in $ADDED; do
            tar -czf "$RUNNER_TEMP/race-$race.tar.gz" -C "$RUNNER_TEMP/data" "$race"
            gh release upload site-data "$RUNNER_TEMP/race-$race.tar.gz" --clobber
          done
      - name: Commit the catalogue
        run: |
          git diff --quiet -- "$CATALOGUE" && { echo "No change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Race catalogue: update from OpenF1 [skip ci]" -- "$CATALOGUE"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      # Compared with what is live, not with this run's commit, so a deploy that failed last time
      # is started again.
      - name: Redeploy the site if it is behind
        env:
          REPO: ${{ github.repository }}
          ADDED: ${{ steps.season.outputs.added }}
        run: |
          curl -fsS "https://${REPO%%/*}.github.io/${REPO##*/}/races.json" -o "$RUNNER_TEMP/live.json" || true
          if [ -z "$ADDED" ] && cmp -s "$RUNNER_TEMP/live.json" "$CATALOGUE"; then
            echo "The site is up to date"
          else
            gh workflow run site.yml --ref main
          fi
      - name: Report an overdue race
        if: steps.season.outputs.failed == 'true'
        run: |
          echo "::error::A finished race is still not on the site; see the recording step"
          exit 1
